name: ci-pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-caller-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    cache-mode: read
