name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sibling-pins:
    name: sibling-pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Module-relative source paths let every checkout share Go build cache
      # entries.
      GOFLAGS: -trimpath
    defaults:
      run:
        working-directory: sibling-pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sibling-pins/go.mod
          cache-dependency-path: sibling-pins/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check generated lint configuration
        run: go run go.kenn.io/kit/cmd/kennlint@v0.38.0 config -check
      - name: Lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 \
            custom --destination "$RUNNER_TEMP" --name custom-gcl
          "$RUNNER_TEMP/custom-gcl" run ./...
      # The action's own lint plugin pin must be on kit's main too.
      - name: Check this repository's sibling pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run . --root ..
      - name: Lint workflows and actions
        working-directory: .
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
