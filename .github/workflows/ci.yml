name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./changes
        id: changes
        with:
          filters: |
            selected: ['**']
      - name: Check changes outputs
        env:
          EVENT: ${{ github.event_name }}
          GROUPS_JSON: ${{ steps.changes.outputs.groups }}
          ALL: ${{ steps.changes.outputs.all }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            test "$GROUPS_JSON" = '["selected"]' && test "$ALL" = false
          else
            test "$GROUPS_JSON" = '[]' && test "$ALL" = true
          fi

  sibling-pins:
    name: sibling-pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Module-relative source paths let every checkout share Go build cache
      # entries.
      GOFLAGS: -trimpath
    defaults:
      run:
        working-directory: sibling-pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sibling-pins/go.mod
          cache-dependency-path: sibling-pins/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check generated lint configuration
        run: go run go.kenn.io/kit/cmd/kennlint@v0.38.0 config -check
      - name: Lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 \
            custom --destination "$RUNNER_TEMP" --name custom-gcl
          "$RUNNER_TEMP/custom-gcl" run ./...
      # The action's own lint plugin pin must be on kit's main too.
      - name: Check this repository's sibling pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run . --root ..
      - name: Lint workflows and actions
        uses: jdx/jactionlint@baa8d685e2b27ff5821558c9eeabb2051c1da61b # v2.4.0
        with:
          version: 2.4.0
          profile: default
          online: "false"
          args: --shellcheck= --pyflakes=
          working-directory: ${{ github.workspace }}
          annotations: "false"

  first-paint:
    name: first-paint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: first-paint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Run the action itself on a page that follows its README.
      - name: Build a page that paints correctly
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          printf '@font-face { font-family: Fixture; src: url("data:font/woff2;base64,AAAA") format("woff2"); }\n' \
            > "$site/site.css"
          {
            printf '<!doctype html><html><head><meta charset="utf-8"><script>'
            cat hold-first-paint.js
            printf '</script><link rel="stylesheet" href="/site.css"></head>'
            printf '<body><p style="font-family: Fixture, monospace">The quick brown fox</p></body></html>\n'
          } > "$site/index.html"
      - uses: ./first-paint
        with:
          dist: ${{ runner.temp }}/site
