name: ci

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'workflow_dispatch' && 1 || 0 }}
      - uses: $/changes
        id: changes
        with:
          filters: |
            some-probe: ['**']
            unmatched-probe: ['__ci_changes_unmatched_probe__']
      - uses: $/changes
        id: reserved
        with:
          filters: "changes: ['**']"
      - uses: $/changes
        id: reserved_unmatched
        with:
          filters: "changes: ['__ci_reserved_unmatched_probe__']"
      - uses: $/changes
        id: malformed
        with:
          filters: 'broken: ['
      - name: Get manual comparison revisions
        if: github.event_name == 'workflow_dispatch'
        id: revisions
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          echo "root=$(git rev-list --max-parents=0 HEAD | tail -n 1)" >> "$GITHUB_OUTPUT"
          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          # An existing ref makes accepting a short hash succeed instead of falling back.
          length=7
          while :; do
            short=${head:0:length}
            if ! git show-ref --verify --quiet "refs/heads/$short" && ! git show-ref --verify --quiet "refs/remotes/origin/$short" && ! git show-ref --verify --quiet "refs/tags/$short"; then break; fi
            length=$((length + 1))
            test "$length" -lt 40
          done
          git branch "$short" "$head"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: root_diff
        with:
          base: ${{ steps.revisions.outputs.root }}
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: same
        with:
          base: ${{ steps.revisions.outputs.head }}
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: reverse
        with:
          base: ${{ steps.revisions.outputs.head }}
          ref: ${{ steps.revisions.outputs.root }}
          filters: |
            action: ['changes/**']
            other: ['__ci_changes_unmatched_probe__/**']
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: missing_base
        with:
          base: ffffffffffffffffffffffffffffffffffffffff
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: zero_base
        with:
          base: '0000000000000000000000000000000000000000'
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: short_base
        with:
          base: ${{ steps.revisions.outputs.short }}
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: branch_ref
        with:
          base: ${{ steps.revisions.outputs.root }}
          ref: main
          filters: "some-probe: ['**']"
      - name: Check changes outputs
        env:
          EVENT: ${{ github.event_name }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files || 0 }}
          GROUPS_JSON: ${{ steps.changes.outputs.groups }}
          ALL: ${{ steps.changes.outputs.all }}
          RESERVED_GROUPS: ${{ steps.reserved.outputs.groups }}
          RESERVED_ALL: ${{ steps.reserved.outputs.all }}
          RESERVED_UNMATCHED_GROUPS: ${{ steps.reserved_unmatched.outputs.groups }}
          RESERVED_UNMATCHED_ALL: ${{ steps.reserved_unmatched.outputs.all }}
          MALFORMED_GROUPS: ${{ steps.malformed.outputs.groups }}
          MALFORMED_ALL: ${{ steps.malformed.outputs.all }}
          ROOT_DIFF_GROUPS: ${{ steps.root_diff.outputs.groups }}
          ROOT_DIFF_ALL: ${{ steps.root_diff.outputs.all }}
          SAME_GROUPS: ${{ steps.same.outputs.groups }}
          SAME_ALL: ${{ steps.same.outputs.all }}
          REVERSE_GROUPS: ${{ steps.reverse.outputs.groups }}
          REVERSE_ALL: ${{ steps.reverse.outputs.all }}
          MISSING_BASE_GROUPS: ${{ steps.missing_base.outputs.groups }}
          MISSING_BASE_ALL: ${{ steps.missing_base.outputs.all }}
          ZERO_BASE: ${{ steps.zero_base.outputs.groups }}/${{ steps.zero_base.outputs.all }}
          SHORT_BASE: ${{ steps.short_base.outputs.groups }}/${{ steps.short_base.outputs.all }}
          BRANCH_REF: ${{ steps.branch_ref.outputs.groups }}/${{ steps.branch_ref.outputs.all }}
        run: |
          # The main-push run covers the skipped-detector path.
          if [[ "$EVENT" == pull_request && "$CHANGED_FILES" -lt 3000 ]]; then
            expected='[]'
            if [[ "$CHANGED_FILES" -gt 0 ]]; then expected='["some-probe"]'; fi
            test "$GROUPS_JSON" = "$expected"
            test "$ALL" = false
            test "$RESERVED_GROUPS" = '[]'
            test "$RESERVED_ALL" = true
            test "$RESERVED_UNMATCHED_GROUPS" = '[]'
            test "$RESERVED_UNMATCHED_ALL" = true
            test "$MALFORMED_GROUPS" = '[]'
            test "$MALFORMED_ALL" = true
          else
            test "$GROUPS_JSON" = '[]'
            test "$ALL" = true
          fi
          if [[ "$EVENT" == workflow_dispatch ]]; then
            test "$ROOT_DIFF_GROUPS" = '["some-probe"]'
            test "$ROOT_DIFF_ALL" = false
            test "$SAME_GROUPS" = '[]'
            test "$SAME_ALL" = false
            test "$REVERSE_GROUPS" = '["action"]'
            test "$REVERSE_ALL" = false
            test "$MISSING_BASE_GROUPS" = '[]'
            test "$MISSING_BASE_ALL" = true
            test "$ZERO_BASE" = '[]/true'
            test "$SHORT_BASE" = '[]/true'
            test "$BRANCH_REF" = '[]/true'
          fi

  sibling-pins:
    name: sibling-pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Module-relative source paths let every checkout share Go build cache
      # entries.
      GOFLAGS: -trimpath
    defaults:
      run:
        working-directory: sibling-pins
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: sibling-pins/go.mod
          cache-dependency-path: sibling-pins/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check generated lint configuration
        run: go run go.kenn.io/kit/cmd/kennlint@v0.38.0 config -check
      - name: Lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 \
            custom --destination "$RUNNER_TEMP" --name custom-gcl
          "$RUNNER_TEMP/custom-gcl" run ./...
      # The action's own lint plugin pin must be on kit's main too.
      - name: Check this repository's sibling pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run . --root ..
      - name: Lint workflows and actions
        uses: step-security/jactionlint@v2.2.0
        with:
          version: 2.4.0
          profile: default
          online: "false"
          args: --shellcheck= --pyflakes=
          working-directory: ${{ github.workspace }}
          annotations: "false"

  release-commands:
    name: release-commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Module-relative source paths let every checkout share Go build cache
      # entries.
      GOFLAGS: -trimpath
    defaults:
      run:
        working-directory: release-commands
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: release-commands/go.mod
          cache-dependency-path: release-commands/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check generated lint configuration
        run: go run go.kenn.io/kit/cmd/kennlint@v0.38.0 config -check
      - name: Lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 \
            custom --destination "$RUNNER_TEMP" --name custom-gcl
          "$RUNNER_TEMP/custom-gcl" run ./...
      - name: Build a fixture release
        run: |
          mkdir -p "$RUNNER_TEMP/release-fixture/bin"
          go build -o "$RUNNER_TEMP/release-fixture/stub" ./testdata/stub
          tar -czf "$RUNNER_TEMP/release-fixture/stub.tar.gz" -C "$RUNNER_TEMP/release-fixture" stub
          printf '`stub group child ID --limit <n>`\n' > "$GITHUB_WORKSPACE/release-commands/testdata/fixture.md"
          # Supply a local release to exercise the composite without network access.
          cat > "$RUNNER_TEMP/release-fixture/bin/gh" <<'SH'
          #!/bin/bash
          set -eu
          case "$1 $2" in
            'release view') echo v1.0.0 ;;
            'release download') cp "$RUNNER_TEMP/release-fixture/stub.tar.gz" "${@: -1}/stub.tar.gz" ;;
            *) exit 2 ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/release-fixture/bin/gh"
          echo "$RUNNER_TEMP/release-fixture/bin" >> "$GITHUB_PATH"
      - uses: $/release-commands
        with:
          files: release-commands/testdata/fixture.md
          binaries: stub
          asset: stub.tar.gz
      - name: Add an unsupported fixture command
        run: printf '`stub nope`\n' > testdata/fixture.md
      - uses: $/release-commands
        id: unsupported_command
        continue-on-error: true
        with:
          files: release-commands/testdata/fixture.md
          binaries: stub
          asset: stub.tar.gz
      - name: Check the action rejects the unsupported command
        env:
          OUTCOME: ${{ steps.unsupported_command.outcome }}
        run: test "$OUTCOME" = failure
      - name: Clean up fixture
        if: always()
        run: rm -f testdata/fixture.md

  delete-waiting-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up fake gh
        run: |
          mkdir -p "$RUNNER_TEMP/fake-gh"
          cat > "$RUNNER_TEMP/fake-gh/gh" <<'SH'
          #!/bin/bash
          set -eu
          if [[ "$1 $2 $3" == 'api -X DELETE' ]]; then
            id=${4##*/}
            echo "$id" >> "$RUNNER_TEMP/$CASE-deleted"
            [[ "$CASE" != failure || "$id" != 2 ]]
          else
            test ! -e "$RUNNER_TEMP/$CASE-deleted"
            range= query= status= branch=
            for arg in "$@"; do
              case "$arg" in
                created=*) range=${arg#created=} ;;
                status=*) status=${arg#status=} ;;
                branch=*) branch=${arg#branch=} ;;
              esac
            done
            while (( $# )); do
              if [[ "$1" == --jq ]]; then query=$2; break; fi
              shift
            done
            [[ -n "$range" && -n "$query" ]]
            [[ "$status" == action_required && "$branch" == "$EXPECTED_BRANCH" ]]
            start=${range%%..*}
            end=${range#*..}
            jq -n --arg case "$CASE" --arg repo "$HEAD_REPO" --arg branch "$branch" --arg status "$status" --arg start "${start:0:19}" --arg end "${end:0:19}" '
              (if $case == "failure" then [range(1; 4)] elif $case == "large" then [range(1; 1004)] else [] end) |
              [ .[] | {id: ., head_repository: {full_name: (if $case == "large" and . <= 1000 then "other/repo" else $repo end)}, head_branch: (if . == 1002 then "other-branch" else $branch end), conclusion: (if . == 1003 then "success" else "action_required" end), created_at: (if . <= 500 then "2025-01-01T00:00:00" else "2026-01-01T00:00:00" end)} | select(.head_branch == $branch and .conclusion == $status and .created_at >= $start and .created_at <= $end)] |
              {total_count: length, workflow_runs: .[:1000]}
            ' | jq -r "$query"
          fi
          SH
          chmod +x "$RUNNER_TEMP/fake-gh/gh"
          echo "$RUNNER_TEMP/fake-gh" >> "$GITHUB_PATH"
      - uses: $/delete-waiting-runs
        id: failed_delete
        continue-on-error: true
        env:
          CASE: failure
      - uses: $/delete-waiting-runs
        id: empty
        env:
          CASE: empty
      - uses: $/delete-waiting-runs
        id: large
        env:
          CASE: large
      - name: Check deletion results
        env:
          FAILED_OUTCOME: ${{ steps.failed_delete.outcome }}
          EMPTY_OUTCOME: ${{ steps.empty.outcome }}
        run: |
          test "$FAILED_OUTCOME" = failure
          test "$EMPTY_OUTCOME" = success
          printf '1\n2\n3\n' | diff -u - "$RUNNER_TEMP/failure-deleted"
          test ! -e "$RUNNER_TEMP/empty-deleted"
          printf '1001\n' | diff -u - "$RUNNER_TEMP/large-deleted"

  first-paint:
    name: first-paint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: first-paint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Run the action itself on a page that follows its README.
      - name: Build a page that paints correctly
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          printf '@font-face { font-family: Fixture; src: url("data:font/woff2;base64,AAAA") format("woff2"); }\n' \
            > "$site/site.css"
          {
            printf '<!doctype html><html><head><meta charset="utf-8"><script>'
            cat hold-first-paint.js
            printf '</script><link rel="stylesheet" href="/site.css"></head>'
            printf '<body><p style="font-family: Fixture, monospace">The quick brown fox</p></body></html>\n'
          } > "$site/index.html"
      - uses: $/first-paint
        with:
          dist: ${{ runner.temp }}/site
