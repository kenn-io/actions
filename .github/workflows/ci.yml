name: ci

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'workflow_dispatch' && 1 || 0 }}
      - uses: $/changes
        id: changes
        with:
          filters: |
            some-probe: ['**']
            unmatched-probe: ['__ci_changes_unmatched_probe__']
      - uses: $/changes
        id: reserved
        with:
          filters: "changes: ['**']"
      - uses: $/changes
        id: reserved_unmatched
        with:
          filters: "changes: ['__ci_reserved_unmatched_probe__']"
      - uses: $/changes
        id: malformed
        with:
          filters: 'broken: ['
      - name: Get manual comparison revisions
        if: github.event_name == 'workflow_dispatch'
        id: revisions
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          echo "root=$(git rev-list --max-parents=0 HEAD | tail -n 1)" >> "$GITHUB_OUTPUT"
          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          # An existing ref makes accepting a short hash succeed instead of falling back.
          length=7
          while :; do
            short=${head:0:length}
            if ! git show-ref --verify --quiet "refs/heads/$short" && ! git show-ref --verify --quiet "refs/remotes/origin/$short" && ! git show-ref --verify --quiet "refs/tags/$short"; then break; fi
            length=$((length + 1))
            test "$length" -lt 40
          done
          git branch "$short" "$head"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: root_diff
        with:
          base: ${{ steps.revisions.outputs.root }}
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: same
        with:
          base: ${{ steps.revisions.outputs.head }}
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: reverse
        with:
          base: ${{ steps.revisions.outputs.head }}
          ref: ${{ steps.revisions.outputs.root }}
          filters: |
            action: ['changes/**']
            other: ['__ci_changes_unmatched_probe__/**']
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: missing_base
        with:
          base: ffffffffffffffffffffffffffffffffffffffff
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: zero_base
        with:
          base: '0000000000000000000000000000000000000000'
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: short_base
        with:
          base: ${{ steps.revisions.outputs.short }}
          filters: "some-probe: ['**']"
      - uses: $/changes
        if: github.event_name == 'workflow_dispatch'
        id: branch_ref
        with:
          base: ${{ steps.revisions.outputs.root }}
          ref: main
          filters: "some-probe: ['**']"
      - name: Check changes outputs
        env:
          EVENT: ${{ github.event_name }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files || 0 }}
          GROUPS_JSON: ${{ steps.changes.outputs.groups }}
          ALL: ${{ steps.changes.outputs.all }}
          RESERVED_GROUPS: ${{ steps.reserved.outputs.groups }}
          RESERVED_ALL: ${{ steps.reserved.outputs.all }}
          RESERVED_UNMATCHED_GROUPS: ${{ steps.reserved_unmatched.outputs.groups }}
          RESERVED_UNMATCHED_ALL: ${{ steps.reserved_unmatched.outputs.all }}
          MALFORMED_GROUPS: ${{ steps.malformed.outputs.groups }}
          MALFORMED_ALL: ${{ steps.malformed.outputs.all }}
          ROOT_DIFF_GROUPS: ${{ steps.root_diff.outputs.groups }}
          ROOT_DIFF_ALL: ${{ steps.root_diff.outputs.all }}
          SAME_GROUPS: ${{ steps.same.outputs.groups }}
          SAME_ALL: ${{ steps.same.outputs.all }}
          REVERSE_GROUPS: ${{ steps.reverse.outputs.groups }}
          REVERSE_ALL: ${{ steps.reverse.outputs.all }}
          MISSING_BASE_GROUPS: ${{ steps.missing_base.outputs.groups }}
          MISSING_BASE_ALL: ${{ steps.missing_base.outputs.all }}
          ZERO_BASE: ${{ steps.zero_base.outputs.groups }}/${{ steps.zero_base.outputs.all }}
          SHORT_BASE: ${{ steps.short_base.outputs.groups }}/${{ steps.short_base.outputs.all }}
          BRANCH_REF: ${{ steps.branch_ref.outputs.groups }}/${{ steps.branch_ref.outputs.all }}
        run: |
          # The main-push run covers the skipped-detector path.
          if [[ "$EVENT" == pull_request && "$CHANGED_FILES" -lt 3000 ]]; then
            expected='[]'
            if [[ "$CHANGED_FILES" -gt 0 ]]; then expected='["some-probe"]'; fi
            test "$GROUPS_JSON" = "$expected"
            test "$ALL" = false
            test "$RESERVED_GROUPS" = '[]'
            test "$RESERVED_ALL" = true
            test "$RESERVED_UNMATCHED_GROUPS" = '[]'
            test "$RESERVED_UNMATCHED_ALL" = true
            test "$MALFORMED_GROUPS" = '[]'
            test "$MALFORMED_ALL" = true
          else
            test "$GROUPS_JSON" = '[]'
            test "$ALL" = true
          fi
          if [[ "$EVENT" == workflow_dispatch ]]; then
            test "$ROOT_DIFF_GROUPS" = '["some-probe"]'
            test "$ROOT_DIFF_ALL" = false
            test "$SAME_GROUPS" = '[]'
            test "$SAME_ALL" = false
            test "$REVERSE_GROUPS" = '["action"]'
            test "$REVERSE_ALL" = false
            test "$MISSING_BASE_GROUPS" = '[]'
            test "$MISSING_BASE_ALL" = true
            test "$ZERO_BASE" = '[]/true'
            test "$SHORT_BASE" = '[]/true'
            test "$BRANCH_REF" = '[]/true'
          fi

  sibling-pins:
    name: sibling-pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Module-relative source paths let every checkout share Go build cache
      # entries.
      GOFLAGS: -trimpath
    defaults:
      run:
        working-directory: sibling-pins
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: sibling-pins/go.mod
          cache-dependency-path: sibling-pins/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check generated lint configuration
        run: go run go.kenn.io/kit/cmd/kennlint@v0.38.0 config -check
      - name: Lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 \
            custom --destination "$RUNNER_TEMP" --name custom-gcl
          "$RUNNER_TEMP/custom-gcl" run ./...
      # The action's own lint plugin pin must be on kit's main too.
      - name: Check this repository's sibling pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run . --root ..
      - name: Lint workflows and actions
        uses: step-security/jactionlint@v2.2.0
        with:
          version: 2.4.0
          profile: default
          online: "false"
          args: --shellcheck= --pyflakes=
          working-directory: ${{ github.workspace }}
          annotations: "false"

  release-commands:
    name: release-commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Module-relative source paths let every checkout share Go build cache
      # entries.
      GOFLAGS: -trimpath
    defaults:
      run:
        working-directory: release-commands
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: release-commands/go.mod
          cache-dependency-path: release-commands/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check generated lint configuration
        run: go run go.kenn.io/kit/cmd/kennlint@v0.38.0 config -check
      - name: Lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 \
            custom --destination "$RUNNER_TEMP" --name custom-gcl
          "$RUNNER_TEMP/custom-gcl" run ./...
      - name: Build a fixture release
        run: |
          mkdir -p "$RUNNER_TEMP/release-fixture/bin"
          go build -o "$RUNNER_TEMP/release-fixture/stub" ./testdata/stub
          tar -czf "$RUNNER_TEMP/release-fixture/stub.tar.gz" -C "$RUNNER_TEMP/release-fixture" stub
          printf '`stub group child ID --limit <n>`\n' > "$GITHUB_WORKSPACE/release-commands/testdata/fixture.md"
          # Supply a local release to exercise the composite without network access.
          cat > "$RUNNER_TEMP/release-fixture/bin/gh" <<'SH'
          #!/bin/bash
          set -eu
          case "$1 $2" in
            'release view') echo v1.0.0 ;;
            'release download') cp "$RUNNER_TEMP/release-fixture/stub.tar.gz" "${@: -1}/stub.tar.gz" ;;
            *) exit 2 ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/release-fixture/bin/gh"
          echo "$RUNNER_TEMP/release-fixture/bin" >> "$GITHUB_PATH"
      - uses: $/release-commands
        with:
          files: release-commands/testdata/fixture.md
          binaries: stub
          asset: stub.tar.gz
      - name: Add an unsupported fixture command
        run: printf '`stub nope`\n' > testdata/fixture.md
      - uses: $/release-commands
        id: unsupported_command
        continue-on-error: true
        with:
          files: release-commands/testdata/fixture.md
          binaries: stub
          asset: stub.tar.gz
      - name: Check the action rejects the unsupported command
        env:
          OUTCOME: ${{ steps.unsupported_command.outcome }}
        run: test "$OUTCOME" = failure
      - name: Clean up fixture
        if: always()
        run: rm -f testdata/fixture.md

  delete-waiting-runs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != '' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.user.login != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_OWNER: ${{ github.event.pull_request.head.user.login }}
      EXPECTED_REPO: ${{ github.repository }}
      EXPECTED_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up fake gh
        run: |
          mkdir -p "$RUNNER_TEMP/fake-gh"
          cat > "$RUNNER_TEMP/fake-gh/gh" <<'SH'
          #!/bin/bash
          set -eu
          [[ -n "$GH_TOKEN" && "$GH_TOKEN" == "$EXPECTED_TOKEN" && "$HEAD_OWNER" == "$EXPECTED_OWNER" ]]
          if [[ "$1 $2 $3 $4" == 'api -i -X DELETE' ]]; then
            [[ "$5" == "repos/$EXPECTED_REPO/actions/runs/"* ]]
            id=${5##*/}
            echo "$id" >> "$RUNNER_TEMP/$CASE-deleted"
            if [[ "$CASE" == gone && "$id" == 2 ]]; then
              echo 'HTTP/2.0 404 Not Found'
              exit 1
            fi
            [[ "$CASE" != failure || "$id" != 2 ]]
          else
            range= query= status= branch= paginate= endpoint=
            for arg in "$@"; do
              case "$arg" in
                created=*) range=${arg#created=} ;;
                status=*) status=${arg#status=} ;;
                branch=*) branch=${arg#branch=} ;;
                --paginate) paginate=1 ;;
                "repos/$EXPECTED_REPO/actions/runs") endpoint=1 ;;
              esac
            done
            while (( $# )); do
              if [[ "$1" == --jq ]]; then query=$2; break; fi
              shift
            done
            [[ -n "$range" && -n "$query" && "$endpoint" == 1 ]]
            [[ "$status" == action_required && "$branch" == "$EXPECTED_BRANCH" ]]
            start=${range%%..*}
            end=${range#*..}
            jq -n --arg case "$CASE" --arg repo "$HEAD_REPO" --arg owner "$EXPECTED_OWNER" --arg branch "$branch" --arg status "$status" --arg start "$start" --arg end "$end" --arg paginate "$paginate" '
              (if $case == "failure" or $case == "gone" or $case == "fallback" then [range(1; 4)] elif $case == "large" or $case == "dense" then [range(1; 1002)] elif $case == "one-second" then [range(1; 1001)] else [] end) |
              [ .[] | {id: ., head_repository: {full_name: (if ($case == "large" and . <= 1000) or ($case == "dense" and . != 999) then ($owner + "/other") elif $case == "fallback" and . == 2 then "other/project" elif $case == "fallback" then ($owner + "/project") else $repo end), owner: {login: (if $case == "fallback" and . == 2 then "other" else $owner end)}}, head_branch: $branch, conclusion: "action_required", created_at: (if $case == "one-second" or ($case == "dense" and . <= 999) or ($case != "dense" and . <= 500) then "2025-01-01T00:00:00Z" else "2026-01-01T00:00:00Z" end)} | select(.head_branch == $branch and .conclusion == $status and .created_at >= $start and .created_at <= $end)] |
              {total_count: length, workflow_runs: (if $paginate == "1" then .[:1000] else .[:100] end)}
            ' | jq -r "$query"
          fi
          SH
          chmod +x "$RUNNER_TEMP/fake-gh/gh"
          echo "$RUNNER_TEMP/fake-gh" >> "$GITHUB_PATH"
      - uses: $/delete-waiting-runs
        env:
          CASE: empty
      - name: Check missing repository and deleted runs
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_OWNER: ${{ github.event.pull_request.head.user.login }}
          GH_TOKEN: fixture-token
          EXPECTED_TOKEN: fixture-token
        run: |
          if CASE=failure bash -e -o pipefail delete-waiting-runs/delete-waiting-runs.sh; then exit 1; fi
          printf '1\n2\n3\n' | diff -u - "$RUNNER_TEMP/failure-deleted"
          CASE=large bash -e -o pipefail delete-waiting-runs/delete-waiting-runs.sh
          printf '1001\n' | diff -u - "$RUNNER_TEMP/large-deleted"
          CASE=gone bash -e -o pipefail delete-waiting-runs/delete-waiting-runs.sh
          printf '1\n2\n3\n' | diff -u - "$RUNNER_TEMP/gone-deleted"
          CASE=fallback HEAD_REPO= bash -e -o pipefail delete-waiting-runs/delete-waiting-runs.sh
          printf '1\n3\n' | diff -u - "$RUNNER_TEMP/fallback-deleted"
          CASE=dense bash -e -o pipefail delete-waiting-runs/delete-waiting-runs.sh
          printf '999\n' | diff -u - "$RUNNER_TEMP/dense-deleted"
          if CASE=one-second bash -e -o pipefail delete-waiting-runs/delete-waiting-runs.sh 2> "$RUNNER_TEMP/one-second-error"; then exit 1; fi
          grep -F 'Too many runs created in one second' "$RUNNER_TEMP/one-second-error"
          test ! -e "$RUNNER_TEMP/one-second-deleted"
          if CASE=missing HEAD_REPO= HEAD_OWNER= bash -e -o pipefail delete-waiting-runs/delete-waiting-runs.sh 2> "$RUNNER_TEMP/missing-error"; then exit 1; fi
          test -s "$RUNNER_TEMP/missing-error"
          test ! -e "$RUNNER_TEMP/missing-deleted"
          test ! -e "$RUNNER_TEMP/empty-deleted"

  test-report-unit:
    name: test-report unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: test-report
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  test-report:
    name: test-report (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Write fixture reports
        run: |
          mkdir -p "$RUNNER_TEMP/fixture/reports/nested"
          printf '{"Action":"pass","Package":"example.com/a","Elapsed":1.5}\n' > "$RUNNER_TEMP/fixture/reports/a.json"
          printf '{"Action":"pass","Package":"example.com/b","Elapsed":0.5}\n' > "$RUNNER_TEMP/fixture/reports/nested/b.json"
      - uses: $/test-report
        id: report
        with:
          suite: fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/fixture/reports/**/*.json
          retention-days: 1
      - uses: $/test-report
        id: missing
        with:
          suite: missing-${{ matrix.os }}
          path: ${{ runner.temp }}/fixture/absent/*.json
      - uses: $/test-report
        id: bad_suite
        continue-on-error: true
        with:
          suite: bad/suite
          path: ${{ runner.temp }}/fixture/reports/*.json
      # GitHub cannot yet serve an artifact to the job that uploaded it, so
      # this job checks the metadata on disk and test-report-download checks
      # the stored artifact.
      - name: Check the action's outputs and metadata
        env:
          NAME: ${{ steps.report.outputs.artifact-name }}
          ID: ${{ steps.report.outputs.artifact-id }}
          MISSING: ${{ steps.missing.outputs.artifact-name }}
          MISSING_ID: ${{ steps.missing.outputs.artifact-id }}
          BAD_SUITE: ${{ steps.bad_suite.outcome }}
          EXPECTED_JOB: ${{ job.check_run_id }}
          OS: ${{ matrix.os }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$NAME" = "gotestsum-fixture-$OS-attempt-$ATTEMPT"
          test -n "$ID"
          test -z "$MISSING"
          test -z "$MISSING_ID"
          test "$BAD_SUITE" = failure
          expected="{\"version\":1,\"kind\":\"gotestsum\",\"suite\":\"fixture-$OS\",\"job_id\":$EXPECTED_JOB,\"run_attempt\":$ATTEMPT}"
          test "$(cat "$RUNNER_TEMP/fixture/reports/kenn-test-report.meta")" = "$expected"

  test-report-download:
    name: test-report download (${{ matrix.os }})
    needs: test-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gotestsum-fixture-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded
      - name: Check the stored artifact
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/downloaded"
          test -f a.json
          test -f nested/b.json
          grep -q "\"suite\":\"fixture-$OS\"" kenn-test-report.meta

  first-paint:
    name: first-paint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: first-paint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Run the action itself on a page that follows its README.
      - name: Build a page that paints correctly
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          printf '@font-face { font-family: Fixture; src: url("data:font/woff2;base64,AAAA") format("woff2"); }\n' \
            > "$site/site.css"
          {
            printf '<!doctype html><html><head><meta charset="utf-8"><script>'
            cat hold-first-paint.js
            printf '</script><link rel="stylesheet" href="/site.css"></head>'
            printf '<body><p style="font-family: Fixture, monospace">The quick brown fox</p></body></html>\n'
          } > "$site/index.html"
      - uses: $/first-paint
        with:
          dist: ${{ runner.temp }}/site
