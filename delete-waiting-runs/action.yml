name: Delete waiting runs
description: Delete runs waiting for approval that match a closed fork pull request's branch and head repository or owner.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_OWNER: ${{ github.event.pull_request.head.user.login }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash -e -o pipefail "$ACTION_PATH/delete-waiting-runs.sh"
