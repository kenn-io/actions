name: Delete waiting runs
description: Delete a closed fork pull request's workflow runs that are waiting for approval.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        ids=$(gh api --paginate -X GET "repos/$REPO/actions/runs" -f status=action_required -f branch="$BRANCH" --jq '.workflow_runs[] | select(.conclusion == "action_required" and .head_repository.full_name == env.HEAD_REPO) | .id')
        while read -r id; do
          [[ -z "$id" ]] || gh api -X DELETE "repos/$REPO/actions/runs/$id"
        done <<< "$ids"
