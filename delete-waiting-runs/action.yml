name: Delete waiting runs
description: Delete runs waiting for approval that match a closed fork pull request's branch and repository.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        list_runs() {
          local start=$1 end=$2 count middle range ids
          range="$(date -u -d "@$start" +%Y-%m-%dT%H:%M:%SZ)..$(date -u -d "@$end" +%Y-%m-%dT%H:%M:%S.999999Z)"
          count=$(gh api -X GET "repos/$REPO/actions/runs" -f status=action_required -f branch="$BRANCH" -f created="$range" -f per_page=1 --jq '.total_count') || return 1
          if (( count >= 1000 )); then
            if (( start == end )); then
              echo "Too many runs created in one second to list safely: $range" >&2
              return 1
            fi
            middle=$((start + (end - start) / 2))
            list_runs "$start" "$middle" || return 1
            list_runs "$((middle + 1))" "$end" || return 1
          else
            ids=$(gh api --paginate -X GET "repos/$REPO/actions/runs" -f status=action_required -f branch="$BRANCH" -f created="$range" -f per_page=100 --jq '.workflow_runs[] | select(.head_repository.full_name == env.HEAD_REPO) | .id') || return 1
            [[ -z "$ids" ]] || printf '%s\n' "$ids"
          fi
        }
        ids=$(list_runs 0 "$(($(date +%s) + 86400))")
        failed=0
        while read -r id; do
          if [[ -n "$id" ]] && ! gh api -X DELETE "repos/$REPO/actions/runs/$id"; then
            failed=1
          fi
        done <<< "$ids"
        exit "$failed"
