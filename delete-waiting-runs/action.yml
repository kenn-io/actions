name: Delete waiting runs
description: Delete a closed fork pull request's workflow runs that are waiting for approval.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        ids=$(gh api --paginate -X GET "repos/$REPO/actions/runs" -f status=action_required -f branch="$BRANCH" --jq '.workflow_runs[] | select(.head_repository.full_name == env.HEAD_REPO) | .id')
        failed=0
        while read -r id; do
          if [[ -n "$id" ]] && ! gh api -X DELETE "repos/$REPO/actions/runs/$id"; then
            failed=1
          fi
        done <<< "$ids"
        exit "$failed"
