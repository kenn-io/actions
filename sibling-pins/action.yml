name: Sibling pins on main
description: >-
  Fail when a dependency file pins a kenn-io sibling repository at a revision
  that is not on that sibling's main branch.

inputs:
  github-token:
    description: >-
      Token that can read every pinned sibling. The job's own token reads
      public siblings; private siblings need a GitHub App token with contents
      read access.
    default: ${{ github.token }}
  ref:
    description: >-
      Candidate revision whose dependency files are checked. The default is the
      merge group head, the pull request merge commit, or the pushed commit.
    default: ${{ github.event.merge_group.head_sha || (github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number)) || github.sha }}

runs:
  using: composite
  steps:
    - name: Check pull request merge ref
      if: startsWith(inputs.ref, 'refs/pull/') && endsWith(inputs.ref, '/merge')
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        TOKEN: ${{ github.token }}
      run: |
        authorization=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
        status=0
        git -c "http.extraheader=AUTHORIZATION: basic $authorization" \
          ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$REF" || status=$?
        if [ "$status" -eq 2 ]; then
          echo '::notice title=Merge conflicts::This pull request conflicts with its base branch, so GitHub has no merge to check. Resolve the conflicts; that push runs this check, as does the merge queue.'
          exit 1
        fi
    # The lockfile of each repository that calls this action pins these tags;
    # this repository's own lockfile does not cover them.
    # Only dependency files are checked out. The checker never runs code from
    # the candidate.
    - name: Checkout candidate dependency files
      uses: actions/checkout@v7.0.1 # jactionlint ignore=unpinned-uses
      with:
        ref: ${{ inputs.ref }}
        path: .sibling-pins-candidate
        persist-credentials: false
        sparse-checkout: |
          go.mod
          package.json
          bun.lock
          Makefile
          .custom-gcl.yml
          action.yml
          action.yaml
          /.github/workflows/
        sparse-checkout-cone-mode: false
    - name: Set up Go for the checker
      uses: actions/setup-go@v7.0.0 # jactionlint ignore=unpinned-uses
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum
    - name: Check sibling pins
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CANDIDATE: ${{ github.workspace }}/.sibling-pins-candidate
      run: go run . --root "$CANDIDATE"
