name: Changes
description: Select CI lanes from caller-defined path filters.
inputs:
  filters:
    description: YAML path groups in dorny/paths-filter syntax. Reserve the changes name.
    required: true
outputs:
  groups:
    description: JSON array of matching group names.
    value: ${{ steps.filter.outputs.changes || '[]' }}
  all:
    description: Whether every job should run for an event other than a pull request.
    value: ${{ github.event_name != 'pull_request' }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      if: github.event_name == 'pull_request'
      id: filter
      with:
        filters: ${{ inputs.filters }}
