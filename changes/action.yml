name: Changes
description: Select CI lanes from caller-defined path filters.
inputs:
  filters:
    description: YAML path groups in dorny/paths-filter syntax. Reserve the changes name.
    required: true
outputs:
  groups:
    description: JSON array of matching group names.
    value: ${{ steps.filter.outputs.changes || '[]' }}
  all:
    description: Whether every job should run because filtering was skipped.
    value: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
      id: filter
      with:
        filters: ${{ inputs.filters }}
        predicate-quantifier: some
